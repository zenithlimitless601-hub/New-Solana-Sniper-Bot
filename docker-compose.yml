version: "3.9"
services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data.db
      - TRADE_MODE=simulation
      - ENTRY_AMOUNT_USD=50
      - TAKE_PROFIT_MULTIPLIERS=2,3,5
      - STOP_LOSS=0.3
      - RISK_THRESHOLD=0.6
    volumes:
      - ./:/app

